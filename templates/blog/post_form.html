{% extends 'base.html' %}

{% block title %}{% if post %}Editar{% else %}Novo{% endif %} post{% endblock %}

{% block content %}
    <h2>{% if post %}Editar post{% else %}Novo post{% endif %}</h2>

    <form method="post">
        {% csrf_token %}
        <p>
            <label for="title">Título:</label><br>
            <input type="text" id="title" name="title" value="{{ post.title }}" size="60">
        </p>
        <p>
            <label for="content">Conteúdo (HTML):</label><br>
            <textarea id="content" name="content" rows="12" cols="60">{{ post.content }}</textarea>
        </p>
        
    
    <div class="botoes1">
        <button type="submit">Salvar</button>
        <button type="submit"><a href="{% url 'post_list' %}">Cancelar</a></button>
    </div>
    </form>
{% endblock %}
