{% extends 'base.html' %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
    <h2>{{ post.title }}</h2>
    <p><small>Postado em {{ post.posted_at|date:"d/m/Y H:i" }}</small></p>

    <div>{{ post.content|safe }}</div>

    <hr>
    <div class="botoes1">
        <button type="submit"><a href="{% url 'post_update' post.pk %}">Editar</a></button> 
        <button type="submit"><a href="{% url 'post_delete' post.pk %}">Remover</a></button>
        <button type="submit"><a href="{% url 'post_list' %}">Voltar</a></button>
    </div>
        
{% endblock %}
