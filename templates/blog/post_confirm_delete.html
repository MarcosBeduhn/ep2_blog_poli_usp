{% extends 'base.html' %}

{% block title %}Remover post{% endblock %}

{% block content %}
    <h2>Remover post</h2>
    <p>Tem certeza que deseja remover "<strong>{{ post.title }}</strong>"?</p>

    <form method="post">
        {% csrf_token %}
        <div class="botoes1">
            <button type="submit">Sim, remover</button>
            <button type="submit"><a href="{% url 'post_detail' post.pk %}">Cancelar</a></button>
        </div>
    </form>
{% endblock %}
